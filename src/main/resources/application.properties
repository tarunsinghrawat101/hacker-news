spring.datasource.url=${DB_URL:jdbc:h2:file:./data/hackernewsclone;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
spring.template.cache=false
server.port=${SERVER_PORT:8085}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


app.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.bootstrap.admin.email=${ADMIN_BOOTSTRAP_EMAIL:admin@gmail.com}
app.bootstrap.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:admin@123}
